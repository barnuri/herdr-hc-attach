id = "barnuri.hc-attach"
name = "hc attach"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Open live herdr-core (hc) terminals as herdr panes: attach, watch view-only, or attach all"
platforms = ["linux", "macos"]

[[panes]]
id = "picker"
title = "hc terminals"
command = ["node", "bin/picker.js"]
placement = "popup"

[[actions]]
id = "attach"
title = "hc: attach a terminal"
contexts = ["workspace", "pane"]
command = ["node", "bin/open.js", "attach"]

[[actions]]
id = "watch"
title = "hc: watch a terminal"
contexts = ["workspace", "pane"]
command = ["node", "bin/open.js", "watch"]

[[actions]]
id = "attach-all"
title = "hc: attach all"
contexts = ["workspace", "pane"]
command = ["node", "bin/open.js", "all"]

[[actions]]
id = "new-synced"
title = "hc: new synced terminal (shows in the herdr app)"
contexts = ["workspace", "pane"]
command = ["node", "bin/new-synced.js"]

[[actions]]
id = "convert"
title = "hc: convert panes to synced (shows them in the herdr app)"
contexts = ["workspace", "pane"]
command = ["node", "bin/convert.js"]

[[panes]]
id = "convert"
title = "hc: convert panes to synced"
command = ["node", "bin/convert.js"]
placement = "popup"

# Keeps TUI workspaces, tabs and panes in step with the herdr app's spaces, tabs and terminals.
[[startup]]
command = ["bash", "scripts/ensure-sync.sh"]

# Heals a dead watcher on the next pane focus.
[[events]]
on = "pane.focused"
command = ["bash", "scripts/ensure-sync.sh"]
